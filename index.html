        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100%;
            height: 100vh;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #stream {
            position: absolute;
            white-space: pre;
            font-size: 18px;
            line-height: 1.1;
            font-weight: bold;
            left: 0;
            top: 0;
            width: 100%;
            animation: flowDown 30s linear infinite;
            background: linear-gradient(180deg, 
                #ff0000 0%, 
                #ff7f00 14%, 
                #ffff00 28%, 
                #00ff00 42%, 
                #0000ff 57%, 
                #4b0082 71%, 
                #9d00ff 85%, 
                #ff0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8)) 
                    drop-shadow(0 0 15px rgba(0, 0, 255, 0.8)) 
                    drop-shadow(0 0 15px rgba(0, 255, 0, 0.8));
        }
        
        @keyframes flowDown {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100vh);
            }
        }
        
        .rainbow {
            animation: rainbow 3s linear infinite;
        }
        
        @keyframes rainbow {
            0% { 
                filter: hue-rotate(0deg) drop-shadow(0 0 20px rgba(255, 0, 0, 1));
            }
            16% { 
                filter: hue-rotate(30deg) drop-shadow(0 0 20px rgba(255, 127, 0, 1));
            }
            33% { 
                filter: hue-rotate(60deg) drop-shadow(0 0 20px rgba(255, 255, 0, 1));
            }
            50% { 
                filter: hue-rotate(120deg) drop-shadow(0 0 20px rgba(0, 255, 0, 1));
            }
            66% { 
                filter: hue-rotate(240deg) drop-shadow(0 0 20px rgba(0, 0, 255, 1));
            }
            83% { 
                filter: hue-rotate(270deg) drop-shadow(0 0 20px rgba(155, 0, 255, 1));
            }
            100% { 
                filter: hue-rotate(360deg) drop-shadow(0 0 20px rgba(255, 0, 0, 1));
            }
        }
    </style>
</head>
